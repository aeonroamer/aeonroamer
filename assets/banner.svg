<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e0846"/>
      <stop offset="0.55" stop-color="#3d1080"/>
      <stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#b34dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b34dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fd2"/>
      <stop offset="0.5" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#3fe3ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf6b"/>
      <stop offset="0.5" stop-color="#ff6fb3"/>
      <stop offset="1" stop-color="#7d5cff"/>
    </linearGradient>
    <linearGradient id="g3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46e6ff"/>
      <stop offset="0.5" stop-color="#b56cff"/>
      <stop offset="1" stop-color="#ff8fd0"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
