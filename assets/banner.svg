    <path id="round" d="M0,-60 C35,-62 65,-35 60,0 C56,38 30,62 -5,58 C-42,54 -64,25 -58,-8 C-52,-40 -30,-58 0,-60Z"/>
    <path id="bean" d="M-50,-30 C-20,-70 60,-60 55,-10 C50,30 10,25 0,50 C-10,75 -60,60 -62,20 C-64,0 -60,-15 -50,-30Z"/>
    <path id="drop" d="M0,-70 C30,-40 55,-5 45,30 C35,62 -30,66 -45,32 C-58,2 -30,-40 0,-70Z"/>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1" fill="none">
    <path d="M640,60 L760,120 L880,70 L1010,140 L1130,90"/>
    <path d="M700,300 L820,250 L940,320 L1060,270 L1170,330"/>
    <path d="M760,120 L820,250 M880,70 L940,320 M1010,140 L1060,270 M1130,90 L1170,330"/>
    <path d="M760,120 L940,320 M880,70 L1060,270"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.7">
    <circle cx="640" cy="60" r="2.5"/><circle cx="760" cy="120" r="3"/><circle cx="880" cy="70" r="2.5"/>
    <circle cx="1010" cy="140" r="3"/><circle cx="1130" cy="90" r="2.5"/><circle cx="700" cy="300" r="2.5"/>
    <circle cx="820" cy="250" r="3"/><circle cx="940" cy="320" r="2.5"/><circle cx="1060" cy="270" r="3"/>
    <circle cx="1170" cy="330" r="2.5"/>
  </g>

  <g filter="url(#soft)" opacity="0.55">
    <use href="#round" fill="url(#g3)" transform="translate(1150,40) scale(0.8)"/>
    <use href="#drop" fill="url(#g2)" transform="translate(690,330) scale(0.6) rotate(200)"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="7s" repeatCount="indefinite"/>
    <use href="#bean" fill="url(#g1)" transform="translate(905,165) scale(1.35) rotate(-15)"/>
    <use href="#bean" fill="url(#gloss)" transform="translate(905,165) scale(1.35) rotate(-15)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="9s" repeatCount="indefinite"/>
    <use href="#round" fill="url(#g2)" transform="translate(1040,230) scale(1.1)"/>
    <use href="#round" fill="url(#gloss)" transform="translate(1040,230) scale(1.1)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-8,-6;0,0" dur="8s" repeatCount="indefinite"/>
    <use href="#drop" fill="url(#g3)" transform="translate(1100,95) scale(0.75) rotate(25)"/>
    <use href="#drop" fill="url(#gloss)" transform="translate(1100,95) scale(0.75) rotate(25)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;6,8;0,0" dur="6s" repeatCount="indefinite"/>
    <use href="#round" fill="url(#g1)" transform="translate(745,285) scale(0.5)"/>
    <use href="#round" fill="url(#gloss)" transform="translate(745,285) scale(0.5)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="5s" repeatCount="indefinite"/>
    <use href="#round" fill="url(#g2)" transform="translate(960,60) scale(0.32)"/>
    <use href="#round" fill="url(#gloss)" transform="translate(960,60) scale(0.32)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;5,-5;0,0" dur="6.5s" repeatCount="indefinite"/>
    <use href="#bean" fill="url(#g3)" transform="translate(930,315) scale(0.45) rotate(120)"/>
    <use href="#bean" fill="url(#gloss)" transform="translate(930,315) scale(0.45) rotate(120)"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" fill="#ffffff">
    <text x="118" y="104" font-size="22" letter-spacing="4" fill-opacity="0.85">RUSTACEAN</text>
    <text x="66" y="200" font-size="92" font-weight="700" letter-spacing="2">AEON ROAMER</text>
    <text x="70" y="250" font-size="26" letter-spacing="9" fill-opacity="0.92">RUST · BACKEND · SYSTEMS</text>
  </g>
  <g transform="translate(88,96)" stroke="#ffffff" fill="none">
    <circle r="16" stroke-width="6" stroke-dasharray="3.3 2.98"/>
    <circle r="12" stroke-width="3"/>
    <text y="6" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" stroke="none">R</text>
  </g>

  <rect x="0" y="335" width="1200" height="65" fill="#ffffff" fill-opacity="0.08"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" fill="#ffffff" fill-opacity="0.85" font-size="18" letter-spacing="3">
    <text x="70" y="374">GITHUB.COM/AEONROAMER</text>
    <text x="470" y="374">LEARNING · BUILDING · SHIPPING</text>
  </g>
</svg>
